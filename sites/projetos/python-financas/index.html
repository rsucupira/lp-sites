<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <title>Projeto Uebey</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f8;color:#0a0a0d}body{display:grid;grid-template-rows:58px 1fr}.barra{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #e3e3e9;background:rgba(255,255,255,.96);position:relative;z-index:2}.marca{font-size:20px;font-weight:700;letter-spacing:-.045em;color:#4f46ff}.divisor{width:1px;height:20px;background:#dedee6}.titulo{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.voltar{margin-left:auto;font-size:12px;text-decoration:none;color:#4f46ff;border:1px solid #dcdbe9;padding:8px 11px;border-radius:9px;background:#fff}.quadro{position:relative;min-height:0}.quadro iframe{width:100%;height:100%;border:0;background:#fff;display:block}.erro{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:32px;background:#f7f7fa}.erro strong{display:block;font-size:22px;margin-bottom:8px}.erro p{color:#6f6f79;max-width:520px;margin:0 auto;line-height:1.6}@media(max-width:600px){body{grid-template-rows:54px 1fr}.barra{padding:0 12px}.divisor{display:none}.titulo{font-size:11px}.voltar{padding:7px 9px}}
  </style>
</head>
<body>
  <header class="barra"><span class="marca">uebey</span><span class="divisor"></span><span class="titulo" id="titulo">Projeto</span><a class="voltar" href="/sites/#portfolio">Voltar aos projetos</a></header>
  <main class="quadro"><iframe id="projeto" title="Projeto Uebey" loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe><div class="erro" id="erro"><div><strong>Projeto não encontrado.</strong><p>Volte ao portfólio da Uebey Sites para escolher outra experiência.</p></div></div></main>
  <script>
    (()=>{const projetos={
      'matematica-leve':['Matemática Leve','https://rsucupira.github.io/resolucao-matematica-vestibular-leve/'],
      'fisica-leve':['Física Leve','https://rsucupira.github.io/resolucao-fisica-vestibular-leve/'],
      'quimica-leve':['Química Leve','https://rsucupira.github.io/resolucao-quimica-vestibular-leve/'],
      'python-financas':['Python para Finanças','https://rsucupira.github.io/python-financas/'],
      'plasticauto':['Plasticauto','https://rsucupira.github.io/lp-plasticauto/'],
      'docura-da-sarah':['Doçura da Sarah','https://rsucupira.github.io/lp-docura-da-sarah/'],
      'carlos-batista-magico':['Carlos Batista — Mágico','https://rsucupira.github.io/lp-magico/'],
      'biotecbrazil':['BiotecBrazil','https://rsucupira.github.io/lp-biotecbrazil/']
    };const partes=location.pathname.split('/').filter(Boolean);const slug=partes[partes.length-1];const item=projetos[slug];if(!item){document.getElementById('projeto').remove();document.getElementById('erro').style.display='grid';return}document.title=item[0]+' — Projeto Uebey';document.getElementById('titulo').textContent=item[0];const frame=document.getElementById('projeto');frame.title=item[0];frame.src=item[1]})();
  </script>
</body>
</html>
